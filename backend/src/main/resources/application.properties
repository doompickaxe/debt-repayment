# REST API lives under /api (matches `servers` in openapi/debt-repayment-api.yaml)
quarkus.rest.path=/api

# OpenAPI: serve the hand-written spec from META-INF/openapi.yaml, don't scan annotations
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# Quinoa: build and serve the Angular app from ../frontend
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=dist/frontend/browser
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.package-manager-command.install=install
quarkus.quinoa.package-manager-command.ci=install --immutable
quarkus.quinoa.dev-server.port=4200
quarkus.quinoa.dev-server.check-timeout=120000
# Tests exercise the backend only
%test.quarkus.quinoa=false
